services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pqc-guard-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    restart: unless-stopped
    networks:
      - pqc-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pqc-guard-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
      - VITE_BACKEND_WS_URL=ws://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - pqc-net

networks:
  pqc-net:
    driver: bridge
